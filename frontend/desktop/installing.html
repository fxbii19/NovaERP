<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NOVA Update</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #020617; color: #f8fafc; font-family: "Segoe UI", sans-serif; }
      main { width: 440px; padding: 42px; text-align: center; }
      .logo { width: 92px; height: 92px; border-radius: 25px; filter: drop-shadow(0 0 24px rgba(174, 205, 158, .45)); animation: pulse 1.4s ease-in-out infinite; }
      h1 { margin: 24px 0 8px; font-size: 25px; }
      p { margin: 0; color: #94a3b8; font-size: 14px; }
      .track { height: 6px; margin-top: 28px; overflow: hidden; border-radius: 999px; background: #172033; }
      .bar { width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #a9c99b, #5c784d); animation: move 1.1s ease-in-out infinite; }
      @keyframes move { from { transform: translateX(-115%); } to { transform: translateX(340%); } }
      @keyframes pulse { 50% { transform: scale(1.05); filter: drop-shadow(0 0 38px rgba(174, 205, 158, .75)); } }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="assets/nova-app-icon.png" alt="NOVA" />
      <h1>Neue Version wird installiert</h1>
      <p>NOVA wird automatisch neu gestartet. Bitte einen Moment warten.</p>
      <div class="track" aria-label="Installation läuft"><div class="bar"></div></div>
    </main>
  </body>
</html>
