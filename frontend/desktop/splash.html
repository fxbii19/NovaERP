<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>NOVA Next startet</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }

      body {
        display: grid;
        place-items: center;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgba(99, 102, 241, 0.2);
        border-radius: 26px;
        background:
          radial-gradient(circle at 50% 48%, rgba(92, 67, 255, 0.18), transparent 36%),
          linear-gradient(145deg, #020617 0%, #050a1c 58%, #071126 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.06),
          0 28px 80px rgba(2, 6, 23, 0.52);
        -webkit-app-region: drag;
      }

      .stage {
        position: relative;
        width: 250px;
        height: 250px;
        display: grid;
        place-items: center;
      }

      .aura,
      .pulse {
        position: absolute;
        inset: 28px;
        border-radius: 50%;
        background: conic-gradient(
          from 210deg,
          rgba(15, 197, 255, 0.4),
          rgba(72, 70, 255, 0.32),
          rgba(151, 47, 255, 0.38),
          rgba(15, 197, 255, 0.4)
        );
        filter: blur(36px);
        opacity: 0;
        animation: aura 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }

      .pulse {
        inset: 56px;
        filter: blur(24px);
        animation: pulse 1.8s ease-in-out 0.9s infinite;
      }

      .logo-mask {
        position: relative;
        width: 190px;
        height: 190px;
        overflow: hidden;
        border-radius: 46px;
        opacity: 0;
        transform: scale(0.84);
        filter: drop-shadow(0 18px 28px rgba(73, 64, 255, 0.22));
        animation: reveal 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.12s forwards;
      }

      .logo {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .shine {
        position: absolute;
        z-index: 2;
        top: -30%;
        bottom: -30%;
        left: -65%;
        width: 42%;
        transform: rotate(14deg);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.78),
          transparent
        );
        filter: blur(5px);
        mix-blend-mode: screen;
        animation: shine 0.9s ease-in-out 0.8s forwards;
      }

      .loader {
        position: absolute;
        left: 50%;
        bottom: 54px;
        width: 190px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.16);
        opacity: 0;
        transform: translateX(-50%);
        animation: loaderIn 0.3s ease-out 0.65s forwards;
      }

      .loader::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, #16c8ff 0%, #4f46ff 50%, #982fff 100%);
        box-shadow: 0 0 14px rgba(79, 70, 255, 0.38);
        transform: translateX(-100%);
        animation: load 2.15s cubic-bezier(0.22, 0.75, 0.28, 1) 0.7s forwards;
      }

      @keyframes reveal {
        0% {
          opacity: 0;
          transform: scale(0.84) translateY(8px);
          filter: blur(10px) drop-shadow(0 0 0 transparent);
        }
        70% {
          opacity: 1;
          transform: scale(1.025) translateY(0);
          filter: blur(0) drop-shadow(0 20px 34px rgba(73, 64, 255, 0.28));
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0) drop-shadow(0 18px 28px rgba(73, 64, 255, 0.22));
        }
      }

      @keyframes aura {
        0% {
          opacity: 0;
          transform: scale(0.55) rotate(-20deg);
        }
        35% {
          opacity: 0.75;
        }
        100% {
          opacity: 0.18;
          transform: scale(1.18) rotate(30deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.16;
          transform: scale(0.9);
        }
        50% {
          opacity: 0.42;
          transform: scale(1.08);
        }
      }

      @keyframes shine {
        from {
          left: -65%;
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        to {
          left: 125%;
          opacity: 0;
        }
      }

      @keyframes loaderIn {
        to {
          opacity: 1;
        }
      }

      @keyframes load {
        to {
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <main class="splash" aria-label="NOVA Next wird gestartet">
      <div class="stage" aria-hidden="true">
        <div class="aura"></div>
        <div class="pulse"></div>
        <div class="logo-mask">
          <img class="logo" src="assets/nova-app-icon.png" alt="" />
          <span class="shine"></span>
        </div>
      </div>
      <div class="loader" aria-hidden="true"></div>
    </main>
  </body>
</html>
